name: Hello Python CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Pylint Check
    runs-on: ubuntu-latest
    steps:
      - name: Get source ode
        uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install pylint
        run: python -m pip install pylint
      - name: check code quality
        run: pylint main.py test_main.py
        